<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<link rel="manifest" href="manifest.webmanifest">
<title>Control de Vencimientos</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:#f7f7f7;background:#0b0b0c}
*{box-sizing:border-box} body{margin:0;background:#0b0b0c}
main{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(30px + env(safe-area-inset-bottom))}
h1{font-size:28px;margin:4px 0 3px}.sub{color:#a7a7ad;margin:0 0 20px}
.card{background:#171719;border:1px solid #2a2a2d;border-radius:20px;padding:16px;margin:12px 0}
label{display:block;color:#bdbdc3;font-size:13px;margin:12px 0 6px}
input,button{font:inherit} input{width:100%;background:#242427;border:1px solid #3a3a3e;color:white;padding:13px;border-radius:12px}
button{border:0;border-radius:13px;padding:13px 15px;font-weight:700}.primary{background:#fff;color:#111;width:100%;margin-top:14px}
.secondary{background:#2a2a2e;color:white}.danger{background:#38191c;color:#ffb8bd}
.row{display:flex;gap:9px}.row>*{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px;border-radius:14px;background:#202023;text-align:center}.stat b{font-size:22px;display:block}
.item{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #2b2b2f}.item:last-child{border:0}.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}.meta{flex:1}.meta b{display:block}.small{font-size:13px;color:#aaaab1;margin-top:3px}.empty{text-align:center;color:#8d8d94;padding:24px 4px}
video{width:100%;border-radius:16px;background:#000;max-height:340px}.hidden{display:none!important}
.toolbar{display:flex;gap:8px;margin:10px 0 2px}.toolbar button{flex:1}
.green{background:#28c840}.yellow{background:#f5c542}.red{background:#ff453a}.gray{background:#73737a}
</style>
</head>
<body><main>
<h1>Control de vencimientos</h1>
<p class="sub">Escaneá, cargá el vencimiento y seguí.</p>

<section class="card">
  <div id="cameraBox" class="hidden">
    <video id="video" playsinline></video>
    <div class="toolbar"><button class="secondary" id="stopCam">Cerrar cámara</button></div>
  </div>
  <label>Código EAN / barras</label>
  <div class="row">
    <input id="ean" inputmode="numeric" placeholder="Ej. 7791234567890">
    <button class="secondary" id="scanBtn">Escanear</button>
  </div>
  <label>Producto</label><input id="name" placeholder="Ej. Yogur natural">
  <label>Lote (opcional)</label><input id="lot" placeholder="Ej. L2409">
  <label>Vencimiento</label><input id="expiry" type="date">
  <button class="primary" id="saveBtn">Guardar producto</button>
</section>

<section class="card">
  <div class="stats">
    <div class="stat"><b id="sExpired">0</b><span>Vencidos</span></div>
    <div class="stat"><b id="sSoon">0</b><span>≤ 30 días</span></div>
    <div class="stat"><b id="sOk">0</b><span>En fecha</span></div>
  </div>
</section>

<section class="card">
  <div class="row">
    <input id="search" placeholder="Buscar producto, EAN o lote">
    <button class="secondary" id="exportBtn">CSV</button>
  </div>
  <div id="list"></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
let items=JSON.parse(localStorage.getItem("expiry-items-v1")||"[]");
let stream=null, scanning=false;

function daysLeft(date){
  const a=new Date(); a.setHours(0,0,0,0);
  const b=new Date(date+"T00:00:00");
  return Math.ceil((b-a)/86400000);
}
function status(d){
  const n=daysLeft(d);
  if(n<0)return ["red","Vencido"];
  if(n<=7)return ["red",`Vence en ${n} día${n===1?"":"s"}`];
  if(n<=30)return ["yellow",`Vence en ${n} días`];
  return ["green",`${n} días`];
}
function render(){
  const q=$("search").value.trim().toLowerCase();
  const sorted=[...items].sort((a,b)=>a.expiry.localeCompare(b.expiry));
  const filtered=sorted.filter(x=>[x.name,x.ean,x.lot].join(" ").toLowerCase().includes(q));
  $("list").innerHTML=filtered.length?"":'<div class="empty">Todavía no hay productos cargados.</div>';
  filtered.forEach(x=>{
    const [c,t]=status(x.expiry);
    const div=document.createElement("div"); div.className="item";
    div.innerHTML=`<span class="dot ${c}"></span><div class="meta"><b>${esc(x.name||"Sin nombre")}</b>
    <div class="small">EAN ${esc(x.ean||"—")} · Lote ${esc(x.lot||"—")}<br>Vence ${fmt(x.expiry)} · ${t}</div></div>
    <button class="danger" data-id="${x.id}">Eliminar</button>`;
    $("list").appendChild(div);
  });
  $("list").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{items=items.filter(x=>x.id!==b.dataset.id);persist()});
  $("sExpired").textContent=items.filter(x=>daysLeft(x.expiry)<0).length;
  $("sSoon").textContent=items.filter(x=>daysLeft(x.expiry)>=0&&daysLeft(x.expiry)<=30).length;
  $("sOk").textContent=items.filter(x=>daysLeft(x.expiry)>30).length;
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function fmt(s){const [y,m,d]=s.split("-");return `${d}/${m}/${y}`}
function persist(){localStorage.setItem("expiry-items-v1",JSON.stringify(items));render()}
$("saveBtn").onclick=()=>{
  if(!$("expiry").value){alert("Ingresá la fecha de vencimiento.");return}
  if(!$("ean").value.trim()&&!$("name").value.trim()){alert("Ingresá un código o nombre de producto.");return}
  items.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),ean:$("ean").value.trim(),name:$("name").value.trim(),lot:$("lot").value.trim(),expiry:$("expiry").value});
  persist(); $("lot").value=""; $("expiry").value=""; $("ean").select();
};
$("search").oninput=render;

$("exportBtn").onclick=()=>{
  const rows=[["Producto","EAN","Lote","Vencimiento"],...items.map(x=>[x.name,x.ean,x.lot,x.expiry])];
  const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));a.download="vencimientos.csv";a.click();
};

async function stopCamera(){scanning=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$("cameraBox").classList.add("hidden")}
$("stopCam").onclick=stopCamera;
$("scanBtn").onclick=async()=>{
  if(!("BarcodeDetector" in window)){alert("En este iPhone/navegador el lector automático no está disponible. Podés escribir el EAN manualmente; la app funciona igual.");return}
  try{
    const formats=await BarcodeDetector.getSupportedFormats();
    const wanted=["ean_13","ean_8","upc_a","upc_e","code_128"].filter(x=>formats.includes(x));
    const detector=new BarcodeDetector({formats:wanted.length?wanted:formats});
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
    $("video").srcObject=stream; await $("video").play(); $("cameraBox").classList.remove("hidden"); scanning=true;
    const loop=async()=>{if(!scanning)return;try{const codes=await detector.detect($("video"));if(codes.length){$("ean").value=codes[0].rawValue;navigator.vibrate?.(80);await stopCamera();$("name").focus();return}}catch(e){} requestAnimationFrame(loop)};loop();
  }catch(e){alert("No pude abrir la cámara. Revisá el permiso de cámara en Safari.");stopCamera()}
};
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
render();
</script></body></html>
