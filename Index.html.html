<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c"><title>Control de vencimientos</title>
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0c;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
main{max-width:760px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 16px 35px}h1{font-size:30px;margin:4px 0}.sub{color:#aaa;margin:0 0 20px}
.card{background:#171719;border:1px solid #2d2d30;border-radius:20px;padding:16px;margin:12px 0}label{display:block;color:#bbb;font-size:14px;margin:12px 0 6px}
input,button{font:inherit}input{width:100%;background:#242427;border:1px solid #3a3a3e;color:white;padding:14px;border-radius:12px}
button{border:0;border-radius:13px;padding:14px;font-weight:700}.primary{background:white;color:#111;width:100%;margin-top:14px}.secondary{background:#303034;color:white}
.row{display:flex;gap:9px}.row input{flex:1;min-width:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#222225;border-radius:14px;padding:12px 5px}.stat b{font-size:24px;display:block}
.item{display:flex;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #2d2d30}.dot{width:12px;height:12px;border-radius:50%;flex:none}.green{background:#30d158}.yellow{background:#ffd60a}.red{background:#ff453a}.meta{flex:1}.meta b{display:block}.small{font-size:13px;color:#aaa;margin-top:4px}
.delete{background:#3a1d20;color:#ffb3b7;padding:9px}.empty{text-align:center;color:#999;padding:22px}
#scanner{display:none;position:fixed;inset:0;background:#000;z-index:50;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#scanner video{width:100%;height:calc(100% - 80px);object-fit:cover}#close{position:absolute;bottom:25px;left:20px;right:20px;background:white;color:#111;z-index:60}
#hint{position:absolute;top:55px;left:20px;right:20px;text-align:center;background:#000a;padding:10px;border-radius:12px;z-index:60}
</style></head><body>
<div id="scanner"><div id="hint">Apuntá al código de barras</div><video id="video" playsinline></video><button id="close">Cerrar cámara</button></div>
<main><h1>Control de vencimientos</h1><p class="sub">Escaneá, cargá el vencimiento y seguí.</p>
<section class="card"><label>Código EAN / barras</label><div class="row"><input id="ean" inputmode="numeric" placeholder="Ej. 7791234567890"><button class="secondary" id="scan">Escanear</button></div>
<label>Producto</label><input id="name" placeholder="Ej. Yogur natural"><label>Lote (opcional)</label><input id="lot" placeholder="Ej. L2409"><label>Vencimiento</label><input id="expiry" type="date"><button class="primary" id="save">Guardar producto</button></section>
<section class="card"><div class="stats"><div class="stat"><b id="expired">0</b>Vencidos</div><div class="stat"><b id="soon">0</b>≤ 30 días</div><div class="stat"><b id="ok">0</b>En fecha</div></div></section>
<section class="card"><div class="row"><input id="search" placeholder="Buscar producto, EAN o lote"><button class="secondary" id="csv">CSV</button></div><div id="list"></div></section></main>
<script>
const $=x=>document.getElementById(x);let items=JSON.parse(localStorage.getItem("expiry-items-v2")||"[]"),reader=null;
function days(s){let a=new Date();a.setHours(0,0,0,0);return Math.ceil((new Date(s+"T00:00:00")-a)/86400000)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){let q=$("search").value.toLowerCase(),arr=[...items].sort((a,b)=>a.expiry.localeCompare(b.expiry)).filter(x=>(x.name+" "+x.ean+" "+x.lot).toLowerCase().includes(q));$("list").innerHTML=arr.length?"":'<div class="empty">Todavía no hay productos cargados.</div>';arr.forEach(x=>{let n=days(x.expiry),c=n<0?"red":n<=30?"yellow":"green",t=n<0?"Vencido":`${n} días`;let d=document.createElement("div");d.className="item";d.innerHTML=`<span class="dot ${c}"></span><div class="meta"><b>${esc(x.name||"Sin nombre")}</b><div class="small">EAN ${esc(x.ean||"—")} · Lote ${esc(x.lot||"—")}<br>Vence ${x.expiry.split("-").reverse().join("/")} · ${t}</div></div><button class="delete" data-id="${x.id}">Eliminar</button>`;$("list").appendChild(d)});document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{items=items.filter(x=>x.id!==b.dataset.id);persist()});$("expired").textContent=items.filter(x=>days(x.expiry)<0).length;$("soon").textContent=items.filter(x=>days(x.expiry)>=0&&days(x.expiry)<=30).length;$("ok").textContent=items.filter(x=>days(x.expiry)>30).length}
function persist(){localStorage.setItem("expiry-items-v2",JSON.stringify(items));render()}
$("save").onclick=()=>{if(!$("expiry").value)return alert("Ingresá la fecha de vencimiento.");if(!$("ean").value.trim()&&!$("name").value.trim())return alert("Ingresá o escaneá un producto.");items.push({id:String(Date.now()),ean:$("ean").value.trim(),name:$("name").value.trim(),lot:$("lot").value.trim(),expiry:$("expiry").value});persist();$("lot").value="";$("expiry").value="";$("ean").value="";$("name").value=""};
$("search").oninput=render;
async function closeScan(){try{reader&&reader.reset()}catch(e){}reader=null;$("scanner").style.display="none"}
$("close").onclick=closeScan;
$("scan").onclick=async()=>{if(!window.ZXing)return alert("No se pudo cargar el lector. Revisá la conexión a internet.");$("scanner").style.display="block";reader=new ZXing.BrowserMultiFormatReader();try{await reader.decodeFromVideoDevice(null,$("video"),(result,err)=>{if(result){$("ean").value=result.getText();navigator.vibrate?.(80);closeScan();$("name").focus()}})}catch(e){closeScan();alert("No pude abrir la cámara. En Ajustes > Safari verificá el permiso de Cámara.")}};
$("csv").onclick=()=>{let r=[["Producto","EAN","Lote","Vencimiento"],...items.map(x=>[x.name,x.ean,x.lot,x.expiry])],s=r.map(a=>a.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+s],{type:"text/csv"}));a.download="vencimientos.csv";a.click()};render();
</script></body></html>
